name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations against SQLite
        env:
          FLASK_ENV: testing
        run: flask --app wsgi.py db upgrade

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for file in frontend/assets/js/*.js; do
            node --check "$file"
          done

      - name: Validate HTML references
        run: |
          test -f frontend/index.html
          test -f frontend/admin/index.html
          test -f frontend/assets/css/styles.css
          test -f frontend/assets/css/admin.css

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t nexus-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t nexus-frontend:ci .
